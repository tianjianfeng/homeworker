apiVersion: apps/v1
kind: Deployment
metadata:
  name: studygame
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studygame
  template:
    metadata:
      labels:
        app: studygame
    spec:
      containers:
      - name: studygame
        image: yourusername/studygame:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: prod
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: url
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: password
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: secret-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5 